  --green:     #4caf7d;

  --text:      #e8ecf2;

  --text3:     #5a6578;

}

  :root:not([data-theme="dark"]) {
    --bg:        #f2f4f7;
    --surface:   #ffffff;
    --surface2:  #eef0f5;
    --border:    #d8dce8;

    --accent-lt: #e0312a;
    --green:     #2e7d52;
    --amber:     #c8850a;
    --text:      #1a1e28;
    --text2:     #4a5468;
    --text3:     #8a93a8;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:        #f2f4f7;
  --surface:   #ffffff;
  --surface2:  #eef0f5;
  --border:    #d8dce8;
  --border2:   #c0c6d8;

  --accent-lt: #e0312a;

/* ── Loading / error ────────────────────────────────────────────────────── */

<script>
// ── Data ─────────────────────────────────────────────────────────────────────
let teamsData    = [];
let fixturesData = {};

// ── State ─────────────────────────────────────────────────────────────────────
let selectedTeam   = null;
let availableCount = null;

// ── Helpers ───────────────────────────────────────────────────────────────────
function parseAgeGroup(str) {
  const m = str.match(/U(\d+)/i);
  return m ? parseInt(m[1]) : null;
}

function parseDivision(str) {
  if (!str) return null;
  const m = str.match(/Division\s+(\d+)/i);
  return m ? parseInt(m[1]) : null;
}

const AGE_GROUP_ORDER = [10, 12, 14, 16, 18];

function getEligibleTeams(requestingTeam) {
  const reqFixture  = fixturesData[requestingTeam];
  const reqAgeGroup = parseAgeGroup(requestingTeam);
  const reqDivision = reqFixture ? parseDivision(reqFixture.division) : null;
  if (!reqAgeGroup || !reqDivision) return [];

  const nextYoungerAge = (() => {
    const idx = AGE_GROUP_ORDER.indexOf(reqAgeGroup);
    return idx > 0 ? AGE_GROUP_ORDER[idx - 1] : null;
  })();

  const eligible = [];
  for (const [teamName, fd] of Object.entries(fixturesData)) {
    if (teamName === requestingTeam) continue;
    const teamAge = parseAgeGroup(teamName);
    const teamDiv = parseDivision(fd.division);
    if (!teamAge || !teamDiv) continue;
    if (teamAge === reqAgeGroup && teamDiv > reqDivision) {
      eligible.push(teamName); continue;
    }
    if (nextYoungerAge && teamAge === nextYoungerAge) {
      if (teamDiv === 1) {
        if (reqDivision <= 2) eligible.push(teamName);
      } else {
        if (teamDiv >= reqDivision - 2) eligible.push(teamName);
      }
    }
  }

  return eligible.sort((a, b) => {
    const ageA = parseAgeGroup(a), ageB = parseAgeGroup(b);
    if (ageB !== ageA) return ageB - ageA;
    const divA = parseDivision((fixturesData[a] || {}).division);
    const divB = parseDivision((fixturesData[b] || {}).division);
    return (divA || 99) - (divB || 99);
  });
}

function brisbaneDate(utcStr) {
  const d = new Date(new Date(utcStr).getTime() + 10 * 60 * 60 * 1000);
  return d.toISOString().slice(0, 10);
}

function brisbaneTime(utcStr) {
  return new Date(utcStr).toLocaleTimeString('en-AU', {
    hour: 'numeric', minute: '2-digit', hour12: true,
    timeZone: 'Australia/Brisbane'
  });
}

function getClashNote(reqGame, eligibleTeamName) {
  const fd = fixturesData[eligibleTeamName];
  if (!fd || !fd.nextGame) return 'no fixture yet';
  const elGame = fd.nextGame;
  const reqDate = brisbaneDate(reqGame.date);
  const elDate  = brisbaneDate(elGame.date);
  if (reqDate !== elDate) return null;
  const reqVenue  = (reqGame.venue  || '').trim().toLowerCase();
  const elVenue   = (elGame.venue   || '').trim().toLowerCase();
  const sameVenue = reqVenue && elVenue && reqVenue === elVenue;
  const threshold = sameVenue ? 50 : 80;
  const gapMin = Math.abs(new Date(reqGame.date) - new Date(elGame.date)) / 60000;
  if (gapMin < threshold) {
    const timeStr  = brisbaneTime(elGame.date);
    const venueStr = [elGame.venue, elGame.court].filter(Boolean).join(', ');
    return `clash ${timeStr}${venueStr ? ' at ' + venueStr : ''}`;
  }
  return null;
}

// ── Split eligible into available vs clashing, grouped by age ────────────────
function buildEligibleGroups(teamName) {
  const fd = fixturesData[teamName];
  const reqGame = fd && fd.nextGame ? fd.nextGame : null;
  const eligible = getEligibleTeams(teamName);

  // { age: { available: [colorName,...], clashing: [colorName,...] } }
  const groups = {};
  for (const t of eligible) {
    const age = parseAgeGroup(t);
    const colorName = t.replace(/^Redbacks U\d+\s+/i, '');
    const clash = reqGame ? getClashNote(reqGame, t) : null;
    if (!groups[age]) groups[age] = { available: [], clashing: [] };
    if (clash) {
      groups[age].clashing.push(colorName);
    } else {
      groups[age].available.push(colorName);
    }
  }

  // Sort age keys descending (older first)
  const sortedAges = Object.keys(groups).map(Number).sort((a, b) => b - a);
  return { groups, sortedAges, reqGame, eligible };
}

// ── Build the condensed plain-text message ────────────────────────────────────
function buildMessage(teamName, count) {
  const fillinsNeeded = 7 - count;
  const fd = fixturesData[teamName];

  let gameDetails = null;
  let reqGame = null;
  if (fd && fd.nextGame) {
    reqGame = fd.nextGame;
    const d = new Date(reqGame.date);
    const dateStr = d.toLocaleDateString('en-AU', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
      timeZone: 'Australia/Brisbane'
    });
    const timeStr = brisbaneTime(reqGame.date);
    const venue = [reqGame.venue, reqGame.court].filter(Boolean).join(', ');
    gameDetails = `${dateStr} at ${timeStr}${venue ? ', ' + venue : ''}`;
  }

  const { groups, sortedAges } = buildEligibleGroups(teamName);
  const teamLines = [];
  let totalClashing = 0;

  for (const age of sortedAges) {
    const g = groups[age];
    totalClashing += g.clashing.length;
    if (g.available.length > 0) {
      teamLines.push(`U${age}: ${g.available.join(', ')}`);
    }
  }

  const lines = [
    `Fill-ins requested for ${teamName}.`,
    `We have ${count} player${count !== 1 ? 's' : ''} confirmed and need up to ${fillinsNeeded} fill-in${fillinsNeeded !== 1 ? 's' : ''}.`,
    ``,
    gameDetails
      ? `Next game: ${gameDetails}.`
      : `Next game details not yet published.`,
    ``,
    `Teams eligible to provide fill-ins:`,
  ];

  if (teamLines.length > 0) {
    lines.push(...teamLines);
  } else {
    lines.push('(none available)');
  }

  if (totalClashing > 0) {
    lines.push(`Not listed: ${totalClashing} team${totalClashing !== 1 ? 's' : ''} with schedule conflicts.`);
  }

  return lines.join('\n').trim();
}

// ── Rendering ─────────────────────────────────────────────────────────────────
function renderAgeDropdown() {
  const ages = [...new Set(teamsData.map(parseAgeGroup).filter(Boolean))].sort((a, b) => a - b);
  const sel = document.getElementById('ageSelect');
  sel.innerHTML = '<option value="">Age…</option>';
  ages.forEach(age => {
    const opt = document.createElement('option');
    opt.value = age;
    opt.textContent = `U${age}`;
    sel.appendChild(opt);
  });
}

function onAgeChange() {
  const age = parseInt(document.getElementById('ageSelect').value);
  const teamSel = document.getElementById('teamSelect');
  selectedTeam = null;
  availableCount = null;
  document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('selected'));

  if (!age) {
    teamSel.innerHTML = '<option value="">Team…</option>';
    teamSel.disabled = true;
    updateUI();
    return;
  }

  const filtered = teamsData.filter(t => parseAgeGroup(t) === age);
  teamSel.innerHTML = '<option value="">Team…</option>';
  filtered.forEach(t => {
    const colorName = t.replace(/^Redbacks U\d+\s+/i, '');
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = colorName;
    teamSel.appendChild(opt);
  });
  teamSel.disabled = false;
  updateUI();
}

function onTeamChange() {
  selectedTeam = document.getElementById('teamSelect').value || null;
  availableCount = null;
  document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('selected'));
  updateUI();
}

function setCount(n) {
  availableCount = n;
  document.querySelectorAll('.count-btn').forEach(b => {
    b.classList.toggle('selected', parseInt(b.dataset.n) === n);
  });
  updateUI();
}

function renderFixture() {
  const area = document.getElementById('fixtureArea');
  if (!selectedTeam) { area.innerHTML = ''; return; }

  const fd = fixturesData[selectedTeam];
  if (!fd) {
    area.innerHTML = `<div class="fixture-box" style="margin-top:14px;"><div class="fixture-none">No fixture data for this team.</div></div>`;
    return;
  }

  let html = `<div class="fixture-box">`;
  if (fd.division) html += `<div class="division-badge">${fd.division}</div>`;

  if (fd.nextGame) {
    const g = fd.nextGame;
    const dateStr = new Date(g.date).toLocaleDateString('en-AU', {
      weekday: 'short', day: 'numeric', month: 'short', year: 'numeric',
      timeZone: 'Australia/Brisbane'
    });
    const timeStr = brisbaneTime(g.date);
    const vs = g.isHome ? `vs ${g.opponent} (Home)` : `vs ${g.opponent} (Away)`;
    html += `<div class="fixture-label">NEXT GAME</div>`;
    html += `<div class="fixture-date">${dateStr} at ${timeStr}</div>`;
    html += `<div class="fixture-detail">${vs}</div>`;
    if (g.venue) {
      html += `<div class="fixture-venue">📍 ${g.court ? g.venue + ' — ' + g.court : g.venue}</div>`;
    }
    if (g.roundName) {
      html += `<div style="font-size:11px;color:var(--text3);margin-top:3px;">${g.roundName}</div>`;
    }
  } else {
    html += `<div class="fixture-none">Next game not yet scheduled.</div>`;
  }

  html += `</div>`;
  area.innerHTML = html;
}

function renderPlayerCount() {
  const card  = document.getElementById('playersCard');
  const row   = document.getElementById('countRow');
  const label = document.getElementById('fillinsNeededLabel');

  if (!selectedTeam) { card.style.display = 'none'; return; }
  card.style.display = 'block';

  if (!row.children.length) {
    [1, 2, 3, 4, 5, 6].forEach(n => {
      const btn = document.createElement('button');
      btn.className = 'count-btn';
      btn.dataset.n = n;
      btn.textContent = n;
      btn.onclick = () => setCount(n);
      row.appendChild(btn);
    });
  }

  if (availableCount !== null) {
    const needed = 7 - availableCount;
    label.innerHTML = `<span class="state-pill pill-warn">⚠ ${needed} fill-in${needed !== 1 ? 's' : ''} needed</span>`;
  } else {
    label.innerHTML = '';
  }
}

function renderMessage() {
  const card    = document.getElementById('messageCard');
  const box     = document.getElementById('messageBox');
  const copyBtn = document.getElementById('copyBtn');
  const eligSec = document.getElementById('eligibleSection');
  const bar     = document.getElementById('stickyBar');

  if (!selectedTeam || availableCount === null) {
    card.style.display = 'none';
    bar.classList.remove('visible');
    copyBtn.disabled = true;
    return;
  }

  card.style.display = 'block';
  bar.classList.add('visible');
  copyBtn.disabled = false;

  box.textContent = buildMessage(selectedTeam, availableCount);

  // Eligible teams panel (grouped, with clash summary)
  const { groups, sortedAges, eligible } = buildEligibleGroups(selectedTeam);
  let totalClashing = 0;
  let hasAvailable = false;

  if (eligible.length === 0) {
    eligSec.innerHTML = `<div class="no-eligible">No eligible teams found for this team.</div>`;
  } else {
    let h = `<div style="font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);margin-bottom:10px;">Eligible Teams</div>`;
    for (const age of sortedAges) {
      const g = groups[age];
      totalClashing += g.clashing.length;
      if (g.available.length > 0) {
        hasAvailable = true;
        h += `<div class="elig-group">
          <div class="elig-age">U${age}</div>
          <div class="elig-names">${g.available.join(', ')}</div>
        </div>`;
      }
    }
    if (!hasAvailable) {
      h += `<div class="no-eligible">No teams available without schedule conflicts.</div>`;
    }
    if (totalClashing > 0) {
      h += `<div class="clash-summary">⚠ ${totalClashing} team${totalClashing !== 1 ? 's' : ''} not shown due to schedule conflicts.</div>`;
    }
    eligSec.innerHTML = h;
  }
}

function updateUI() {
  renderFixture();
  renderPlayerCount();
  renderMessage();
}

// ── Copy ──────────────────────────────────────────────────────────────────────
function copyMessage() {
  if (!selectedTeam || availableCount === null) return;
  const msg = buildMessage(selectedTeam, availableCount);
  const toast = document.getElementById('toast');
  const btn   = document.getElementById('copyBtn');

  navigator.clipboard.writeText(msg).then(() => {
    toast.classList.add('show');
    btn.textContent = '✓ Copied!';
    setTimeout(() => {
      toast.classList.remove('show');
      btn.innerHTML = '📋 Copy Message';
    }, 2200);
  }).catch(() => {
    const box = document.getElementById('messageBox');
    const range = document.createRange();
    range.selectNodeContents(box);
    const sel = window.getSelection();
    if (sel) { sel.removeAllRanges(); sel.addRange(range); }
    toast.textContent = 'Long-press the message text to copy';
    toast.classList.add('show');
    setTimeout(() => { toast.classList.remove('show'); toast.textContent = '✓ Copied!'; }, 2800);
  });
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
async function init() {
  const loadingArea = document.getElementById('loadingArea');
  const errorArea   = document.getElementById('errorArea');

  try {
    const [teamsResp, fixturesResp] = await Promise.all([
      fetch('./teams.json?v=' + Date.now()),
      fetch('./fixtures.json?v=' + Date.now()),
    ]);
    if (!teamsResp.ok) throw new Error(`teams.json: HTTP ${teamsResp.status}`);
    const td = await teamsResp.json();
    teamsData = Array.isArray(td.teams) ? td.teams : [];
    if (!teamsData.length) throw new Error('No teams found.');

    if (fixturesResp.ok) {
      const fd = await fixturesResp.json();
      fixturesData = fd.fixtures || {};
    }

    loadingArea.hidden = true;
    renderAgeDropdown();
  } catch(e) {
    loadingArea.hidden = true;
    errorArea.hidden = false;
    errorArea.textContent = `Couldn't load team data. Try refreshing. (${e.message})`;
  }
}

init();
</script>
