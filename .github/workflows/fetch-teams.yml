name: Fetch Teams and Fixtures

on:
  schedule:
    # Runs every Monday at 2am AEST (Sunday 4pm UTC)
    - cron: '0 16 * * 0'
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch teams from BasketballConnect
        run: |
          echo "Fetching team list..."
          curl -s \
            "https://registration.basketballconnect.com/liveScoreSeasonFixture?organisationKey=155fb981-71f6-48a0-a53f-1da7ee78fb39&yearId=8&competitionUniqueKey=ae31672b-fa16-475f-b569-deda015aba60&divisionId=All" \
            -o raw_teams.json
          echo "Teams response (first 200 chars):"
          head -c 200 raw_teams.json
          echo ""

      - name: Fetch fixtures from Squadi API
        run: |
          echo "Fetching fixtures..."
          curl -s \
            --globoff \
            "https://api-basketball.squadi.com/livescores/round/matches?competitionId=2449&divisionId=&teamIds=&ignoreStatuses=[1]" \
            -H "Authorization: " \
            -H "Origin: https://registration.basketballconnect.com" \
            -H "Referer: https://registration.basketballconnect.com/" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:150.0) Gecko/20100101 Firefox/150.0" \
            -o raw_fixtures.json
          echo "Fixtures response (first 500 chars):"
          head -c 500 raw_fixtures.json
          echo ""
          echo "Fixtures HTTP status:"
          curl -s -o /dev/null -w "%{http_code}" \
            --globoff \
            "https://api-basketball.squadi.com/livescores/round/matches?competitionId=2449&divisionId=&teamIds=&ignoreStatuses=[1]" \
            -H "Authorization: " \
            -H "Origin: https://registration.basketballconnect.com" \
            -H "Referer: https://registration.basketballconnect.com/" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:150.0) Gecko/20100101 Firefox/150.0"
          echo ""

      - name: Parse and write JSON files
        run: |
          python3 << 'PYEOF'
          import json, datetime, sys

          now = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')

          # ── teams.json ──────────────────────────────────────────────────────
          try:
              with open('raw_teams.json') as f:
                  teams_data = json.load(f)
              redbacks = sorted(
                  t['name'].strip()
                  for t in teams_data
                  if isinstance(t.get('name'), str) and t['name'].strip().startswith('Redbacks')
              )
              with open('teams.json', 'w') as f:
                  json.dump({"teams": redbacks, "updatedAt": now}, f, indent=2)
              print(f"OK: written {len(redbacks)} Redbacks teams to teams.json")
          except Exception as e:
              print(f"ERROR parsing teams: {e}", file=sys.stderr)
              sys.exit(1)

          # ── fixtures.json ────────────────────────────────────────────────────
          try:
              with open('raw_fixtures.json') as f:
                  raw = f.read().strip()

              if not raw or raw[0] not in '[{':
                  print(f"WARNING: fixtures returned unexpected data: {raw[:200]}")
              else:
                  fix_data = json.loads(raw)

                  # Log structure to help understand and refine the parser
                  print(f"Fixture data type: {type(fix_data).__name__}")
                  if isinstance(fix_data, list):
                      print(f"List length: {len(fix_data)}")
                      if fix_data:
                          first = fix_data[0]
                          print(f"First item keys: {list(first.keys())}")
                          print(f"First item:\n{json.dumps(first, indent=2)[:1000]}")
                  elif isinstance(fix_data, dict):
                      print(f"Top-level keys: {list(fix_data.keys())}")
                      print(f"Sample:\n{json.dumps(fix_data, indent=2)[:1000]}")

                  # Write raw data as fixtures.json for now
                  # Parser will be refined once we see the actual structure
                  with open('fixtures.json', 'w') as f:
                      json.dump({"raw": fix_data, "updatedAt": now}, f, indent=2)
                  print("OK: written fixtures.json (raw — parser to be refined)")

          except Exception as e:
              print(f"WARNING: could not process fixtures: {e}")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add teams.json fixtures.json 2>/dev/null || git add teams.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore: update teams and fixtures data"
            git push
          fi
