name: PWA service worker auto-versioning

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Stamp version into sw.js
        run: |
          # Use the short git SHA as the version — changes on every push
          VERSION=$(git rev-parse --short HEAD)
          echo "Stamping sw.js with version: $VERSION"
          sed -i "s/AUTO_VERSION/$VERSION/" sw.js
          cat sw.js | grep CACHE_VERSION
