name: Fetch Teams and Fixtures

on:
  schedule:
    # Runs every Monday at 2am AEST (Sunday 4pm UTC)
    - cron: '0 16 * * 0'
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npm install playwright

      - name: Install Chromium browser
        run: npx playwright install chromium --with-deps

      - name: Run fetch script
        run: node save-page.js

      - name: Commit and push JSON files if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add teams.json fixtures.json 2>/dev/null || git add teams.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore: update teams and fixtures data"
            git push
          fi
